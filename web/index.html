<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogOS — Symbolic Chat</title>
    <link rel="stylesheet" href="/static/styles.css?v=202602083" />
  </head>
  <body>
    <main class="app">
      <section class="pane left">
        <header class="brand">
          <h1>LogOS</h1>
          <p>Symbolic, resource-efficient conversational reasoning.</p>
        </header>

        <section class="chat" id="chat"></section>

        <form class="composer" id="composer">
          <input
            type="text"
            name="message"
            id="message"
            placeholder="Say something about yourself or ask a question..."
            autocomplete="off"
            required
          />
          <button type="submit">Send</button>
        </form>
      </section>

      <section class="pane right">
        <header class="link-head">
          <h2>Knowledge Links</h2>
          <p class="link-sub">Full table view of the hypergraph links.</p>
        </header>

        <div class="link-tools">
          <input
            type="text"
            id="linkSearch"
            placeholder="Filter, e.g. source:computer; relation:where_loc"
            autocomplete="off"
          />
          <div class="link-count" id="linkCount">0 links</div>
        </div>

        <div class="link-table-wrap">
          <table class="link-table">
            <colgroup>
              <col class="col-source" />
              <col class="col-relation" />
              <col class="col-target" />
              <col class="col-metric" />
              <col class="col-metric" />
              <col class="col-time" />
            </colgroup>
            <thead>
              <tr>
                <th data-key="source_label">Source</th>
                <th data-key="relation">Relation</th>
                <th data-key="target_label">Target</th>
                <th data-key="generality" data-type="number">g</th>
                <th data-key="actuality" data-type="number">a</th>
                <th data-key="created_at" data-type="time">Timestamp</th>
              </tr>
            </thead>
            <tbody id="linkTableBody">
              <tr>
                <td class="empty" colspan="6">Send a message to build the knowledge base.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const chat = document.getElementById("chat");
      const composer = document.getElementById("composer");
      const messageInput = document.getElementById("message");

      const linkSearch = document.getElementById("linkSearch");
      const linkCount = document.getElementById("linkCount");
      const linkTableBody = document.getElementById("linkTableBody");
      const linkTable = document.querySelector(".link-table");
      let linkData = [];
      let sortState = { key: "created_at", dir: "desc" };

      const appendBubble = (text, type) => {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${type}`;
        bubble.textContent = text;
        chat.appendChild(bubble);
        chat.scrollTop = chat.scrollHeight;
      };

      appendBubble("Hi! Tell me about yourself or ask what I know.", "bot");

      const parseFilters = (raw) => {
        if (!raw) return { tokens: [], text: "" };
        const parts = raw
          .split(";")
          .map((p) => p.trim())
          .filter(Boolean);
        const tokens = [];
        let residual = [];
        for (const part of parts) {
          const idx = part.indexOf(":");
          if (idx === -1) {
            residual.push(part);
            continue;
          }
          const key = part.slice(0, idx).trim().toLowerCase();
          const value = part.slice(idx + 1).trim().toLowerCase();
          if (!key || !value) {
            continue;
          }
          tokens.push({ key, value });
        }
        return { tokens, text: residual.join(" ").trim().toLowerCase() };
      };

      const matchFilter = (link, filter) => {
        const source = (link.source_label || "").toLowerCase();
        const relation = (link.relation || "").toLowerCase();
        const target = (link.target_label || "").toLowerCase();
        for (const { key, value } of filter.tokens) {
          if (key === "source" && !source.includes(value)) return false;
          if (key === "relation" && !relation.includes(value)) return false;
          if (key === "target" && !target.includes(value)) return false;
        }
        if (filter.text) {
          const hay = `${source} ${relation} ${target}`;
          if (!hay.includes(filter.text)) return false;
        }
        return true;
      };

      const renderLinks = () => {
        const filter = parseFilters(linkSearch.value);
        let rows = linkData.filter((l) => matchFilter(l, filter));
        if (sortState.key) {
          const dir = sortState.dir === "desc" ? -1 : 1;
          const key = sortState.key;
          rows = rows.slice().sort((a, b) => {
            const aVal = sortValue(a, key);
            const bVal = sortValue(b, key);
            if (aVal < bVal) return -1 * dir;
            if (aVal > bVal) return 1 * dir;
            return 0;
          });
        }
        linkCount.textContent = `${rows.length} link${rows.length === 1 ? "" : "s"}`;
        if (!rows.length) {
          linkTableBody.innerHTML = `<tr><td class="empty" colspan="6">No links match the filter.</td></tr>`;
          return;
        }
        linkTableBody.innerHTML = rows
          .map((l) => {
            const g = Number(l.generality ?? 0).toFixed(2);
            const a = Number(l.actuality ?? 0).toFixed(2);
            const ts = l.created_at || "";
            return `<tr>
              <td>${l.source_label ?? l.source}</td>
              <td class="relation">${l.relation ?? ""}</td>
              <td>${l.target_label ?? l.target}</td>
              <td class="metric">${g}</td>
              <td class="metric">${a}</td>
              <td class="timestamp">${ts}</td>
            </tr>`;
          })
          .join("");
      };

      linkSearch.addEventListener("input", renderLinks);

      const sortValue = (row, key) => {
        if (key === "generality" || key === "actuality") {
          return Number(row[key] ?? 0);
        }
        if (key === "created_at") {
          const raw = row.created_at;
          const parsed = raw ? Date.parse(raw) : NaN;
          return Number.isFinite(parsed) ? parsed : 0;
        }
        if (key === "source_label") {
          return (row.source_label ?? row.source ?? "").toString().toLowerCase();
        }
        if (key === "target_label") {
          return (row.target_label ?? row.target ?? "").toString().toLowerCase();
        }
        return (row[key] ?? "").toString().toLowerCase();
      };

      const updateSortIndicators = () => {
        const headers = linkTable.querySelectorAll("thead th[data-key]");
        headers.forEach((th) => {
          const key = th.dataset.key;
          if (key === sortState.key) {
            th.dataset.sort = sortState.dir;
          } else {
            th.dataset.sort = "none";
          }
        });
      };

      const initSorting = () => {
        const headers = linkTable.querySelectorAll("thead th[data-key]");
        headers.forEach((th) => {
          th.addEventListener("click", (event) => {
            if (event.target?.classList?.contains("col-resizer")) return;
            const key = th.dataset.key;
            if (sortState.key === key) {
              sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
            } else {
              sortState.key = key;
              sortState.dir = "asc";
            }
            updateSortIndicators();
            renderLinks();
          });
        });
        updateSortIndicators();
      };

      const initResizableColumns = () => {
        const headers = Array.from(linkTable.querySelectorAll("thead th"));
        const cols = Array.from(linkTable.querySelectorAll("colgroup col"));
        if (!headers.length || cols.length !== headers.length) return;

        headers.forEach((th, index) => {
          const resizer = document.createElement("div");
          resizer.className = "col-resizer";
          th.appendChild(resizer);

          let startX = 0;
          let startWidth = 0;

          const onMouseMove = (event) => {
            const delta = event.clientX - startX;
            const nextWidth = Math.max(80, startWidth + delta);
            cols[index].style.width = `${nextWidth}px`;
          };

          const onMouseUp = () => {
            document.body.style.cursor = "";
            document.removeEventListener("mousemove", onMouseMove);
            document.removeEventListener("mouseup", onMouseUp);
          };

          resizer.addEventListener("mousedown", (event) => {
            event.preventDefault();
            event.stopPropagation();
            startX = event.clientX;
            startWidth = th.getBoundingClientRect().width;
            document.body.style.cursor = "col-resize";
            document.addEventListener("mousemove", onMouseMove);
            document.addEventListener("mouseup", onMouseUp);
          });
        });

        headers.forEach((th, index) => {
          cols[index].style.width = `${th.getBoundingClientRect().width}px`;
        });
      };

      initSorting();
      initResizableColumns();

      composer.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = messageInput.value.trim();
        if (!message) return;
        appendBubble(message, "user");
        messageInput.value = "";

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await response.json();
        appendBubble(data.reply, "bot");
        linkData = Array.isArray(data.links) ? data.links : [];
        renderLinks();
      });
    </script>
  </body>
</html>
